[package]
name = "yaah"
version = "0.6.7"
description = "YAAH - AI Coding Agent"
authors = ["elboaf"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# Hyperlinks open in the OS default browser (#31): the webview swallows
# target=_blank navigation, so the frontend hands approved hrefs to this.
# Installer download for in-app update (#16). Rustls: no OpenSSL linkage on
# the Linux build; the default-tls variant would drag in native-tls.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

[target.'cfg(target_os = "linux")'.dependencies]
# must stay version-compatible with the webkit2gtk tauri/wry pull in (~2.x)
webkit2gtk = { version = "2", features = ["v2_4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# open_external (#59): ShellExecuteW without going through cmd.exe.
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

# glib 0.20.12 via coordinated patch (RUSTSEC-2024-0429, Dependabot alert #5).
# glib 0.18.5 has unsound VariantStrIter impls (NULL deref); fixed in glib 0.20.0+.
# The fix requires a coordinated version bump across the whole gtk-rs + webkit2gtk
# chain (verified: no single version works). glib 0.20.12 lives in gtk-rs-core
# 0.22.0 (requires glib ^0.22); gtk-rs 0.19.0 requires glib ^0.22; webkit2gtk
# 3.0.0 requires glib ^0.22 + gtk-sys ^0.19. tauri 2.12.7 pins gtk ^0.18 and
# webkit2gtk ^2, so tauri itself is patched from git (tag tauri-v2.12.7) to use
# gtk 0.19. libappindicator 0.10.0 (gtk ^0.19) replaces 0.9.0 (gtk ^0.18).
# The same glib-2.0/gio-2.0/gobject-2.0 native libs are linked — no new system deps.
[patch.crates-io]
glib = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
glib-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
gio = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
gio-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
gobject-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
cairo-rs = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
cairo-sys-rs = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
pango = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
pango-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
pangocairo = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
pangocairo-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
gdk-pixbuf = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
gdk-pixbuf-sys = { git = "https://github.com/gtk-rs/gtk-rs-core", tag = "0.22.0" }
atk = { git = "https://github.com/gtk-rs/gtk-rs", tag = "0.19.0" }
atk-sys = { git = "https://github.com/gtk-rs/gtk-rs", tag = "0.19.0" }
gdk = { git = "https://github.com/gtk-rs/gtk-rs", tag = "0.19.0" }
gdk-sys = { git = "https://github.com/gtk-rs/gtk-rs", tag = "0.19.0" }
gtk = { git = "https://github.com/gtk-rs/gtk-rs", tag = "0.19.0" }
gtk-sys = { git = "https://github.com/gtk-rs/gtk-rs", tag = "0.19.0" }
