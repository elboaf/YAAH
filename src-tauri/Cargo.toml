[package]
name = "yaah"
version = "0.6.7"
description = "YAAH - AI Coding Agent"
authors = ["elboaf"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# Hyperlinks open in the OS default browser (#31): the webview swallows
# target=_blank navigation, so the frontend hands approved hrefs to this.
tauri-plugin-opener = "2"
# Installer download for in-app update (#16). Rustls: no OpenSSL linkage on
# the Linux build; the default-tls variant would drag in native-tls.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

[target.'cfg(target_os = "linux")'.dependencies]
# must stay version-compatible with the webkit2gtk tauri/wry pull in (~2.x)
webkit2gtk = { version = "2", features = ["v2_4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# open_external (#59): ShellExecuteW without going through cmd.exe.
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }
