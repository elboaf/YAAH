name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One push supersedes the previous: cancel the in-flight run for the same
# ref so the self-hosted Linux runners spend their time on the newest
# commit instead of serially chewing through superseded history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    # herp pool (either runner): the Windows runners' default shell is
    # PowerShell and their execution policy blocks even `npm ci` - and
    # these are bash-flavored jobs. GitHub-hosted runners never carry
    # the bare "Linux" label.
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  backend:
    name: Backend tests (shard ${{ matrix.shard }})
    # herp pool: the two Linux runners take one shard each, so the suite's
    # wall time is roughly half of the single-job era. The bare "Linux"
    # label matches only the herp runners (GitHub-hosted runners never
    # carry it).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # The runner cache keys on requirements.txt only; pytest-shard and
          # pytest-xdist are listed there, but a warm runner whose cache
          # predates the pin would otherwise run unshardable/unparallel.
          # Explicit here until the next full requirements refresh
          # repopulates the cache.
          python -c "import pytest_shard" 2>/dev/null || pip install "pytest-shard>=0.1.2"
          python -c "import xdist" 2>/dev/null || pip install "pytest-xdist>=3.5"

      - name: Run tests
        run: |
          # pytest-shard splits the suite across the two herp runners;
          # xdist -n 2 parallelizes within each shard (single-core-per-shard
          # was the pre-#372 gap). Validated: xdist failure set identical to
          # serial; conftest env redirect is per-process so each worker gets
          # its own throwaway DB/config.
          pytest backend/tests -v --shard-id ${{ matrix.shard }} --num-shards 2 \
            -n 2 2>&1 | tee test-output.log
          test ${PIPESTATUS[0]} -eq 0

      # Logs are auth-gated on GitHub; surface failures via annotations,
      # which are readable through the public API.
      - name: Report failures
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" test-output.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          tail -50 test-output.log | while IFS= read -r line; do echo "::error::$line"; done
