name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend build
    # herp only: the Windows runner's default shell is PowerShell and its
    # execution policy blocks even `npm ci` — and these are bash-flavored
    # jobs. GitHub-hosted runners never carry the bare "Linux" label.
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  backend:
    name: Backend tests
    # herp only (see frontend note).
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest backend/tests -v 2>&1 | tee test-output.log
          test ${PIPESTATUS[0]} -eq 0

      # Logs are auth-gated on GitHub; surface failures via annotations,
      # which are readable through the public API.
      - name: Report failures
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" test-output.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          tail -50 test-output.log | while IFS= read -r line; do echo "::error::$line"; done
