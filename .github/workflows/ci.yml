name: CI

on:
  pull_request:
    branches: [master]

# No push trigger by design (docs/agents/testing.md): the full suite is a
# gate at the edges only — PR review and release. Plain pushes (feature
# branches, master) get no CI; a merge-commit push to master re-tests the
# exact tree the PR edge already tested, and the release edge re-tests the
# tagged tree. Branch pushes with no open PR are covered only by the
# agents' targeted local runs (see docs/agents/testing.md).

# One push supersedes the previous: cancel the in-flight run for the same
# ref so the self-hosted Linux runners spend their time on the newest
# commit instead of serially chewing through superseded history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # #778: must stay IDENTICAL to the block in release.yml — CI's backend
  # job runs on the same Ubuntu 26.04 self-hosted pool, so its tests run
  # on the same pinned BASELINE (non-x86-64-v3) CPython the Linux sidecar
  # freeze uses. See release.yml for the full rationale.
  PBS_RELEASE_TAG: "20261110"
  PBS_VERSION: "3.12.16"
  PBS_ASSET: "cpython-3.12.16+20261110-x86_64-unknown-linux-gnu-install_only.tar.gz"
  PBS_SHA256: "c2f87d4b4e8db3abddb0f116c6ccfc503d0cbdbb9ee8faacddad1b679ec12e99"

jobs:
  frontend:
    name: Frontend build
    # herp pool (either runner): the Windows runners' default shell is
    # PowerShell and their execution policy blocks even `npm ci` - and
    # these are bash-flavored jobs. GitHub-hosted runners never carry
    # the bare "Linux" label.
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # undici 8.x (transitive via vitest) requires node >=22.19.0 — its
          # decompress interceptor calls zlib.createZstdDecompress, undefined
          # on Node 20, which makes every forks worker die at module load with
          # "Cannot read properties of undefined (reading 'bind')".
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Frontend vitest suite (jsdom, per vite.config.ts) — gates component /
      # transcript regressions that the type-check and build don't reach. Runs
      # before the build: it's cheaper and failures are far easier to localize.
      - name: Test (frontend)
        run: npm run test:frontend

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  backend:
    name: Backend tests (shard ${{ matrix.shard }})
    # herp pool: the two Linux runners take one shard each, so the suite's
    # wall time is roughly half of the single-job era. The bare "Linux"
    # label matches only the herp runners (GitHub-hosted runners never
    # carry it).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4

      # #778: the backend suite runs on the same Ubuntu 26.04 pool the
      # Linux sidecar freeze uses — run it on the same pinned BASELINE
      # (non-x86-64-v3) CPython (see release.yml).
      - name: Provision baseline CPython (matches Linux sidecar freeze)
        if: matrix.shard == 0
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE_TAG}/${PBS_ASSET}"
          echo "downloading $url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pbs.tar.gz" "$url"
          echo "${PBS_SHA256}  ${RUNNER_TEMP}/pbs.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/baseline-python"
          tar -xzf "$RUNNER_TEMP/pbs.tar.gz" -C "$RUNNER_TEMP/baseline-python"
          PYBIN="$RUNNER_TEMP/baseline-python/python/bin"
          "$PYBIN/python" -VV
          echo "$PYBIN" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        if: matrix.shard != 0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # The runner cache keys on requirements.txt only; pytest-shard and
          # pytest-xdist are listed there, but a warm runner whose cache
          # predates the pin would otherwise run unshardable/unparallel.
          # Explicit here until the next full requirements refresh
          # repopulates the cache.
          python -c "import pytest_shard" 2>/dev/null || pip install "pytest-shard>=0.1.2"
          python -c "import xdist" 2>/dev/null || pip install "pytest-xdist>=3.5"

      - name: Run tests
        run: |
          # pytest-shard splits the suite across the two herp runners;
          # xdist -n 2 parallelizes within each shard (single-core-per-shard
          # was the pre-#372 gap). Validated: xdist failure set identical to
          # serial; conftest env redirect is per-process so each worker gets
          # its own throwaway DB/config.
          pytest backend/tests -v --shard-id ${{ matrix.shard }} --num-shards 2 \
            -n 2 2>&1 | tee test-output.log
          test ${PIPESTATUS[0]} -eq 0

      # Logs are auth-gated on GitHub; surface failures via annotations,
      # which are readable through the public API.
      - name: Report failures
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" test-output.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          tail -50 test-output.log | while IFS= read -r line; do echo "::error::$line"; done
