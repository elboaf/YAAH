name: Release

# Desktop installers (Q34 / plan Step 13): built with the Tauri CLI on tag push.
# Publishes the GitHub Release automatically (no manual draft promotion).
# Apps are unsigned — expect OS security warnings on first run.

on:
  push:
    tags: ["v*"]
  # Invoked by tag-on-bump.yml after it validates + pushes the version tag.
  # GITHUB_TOKEN-created tags don't trigger other workflows (GitHub's
  # recursion guard), so the release build is called directly instead of
  # relying on the tag-push event.
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish (e.g. v0.19.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a GitHub pre-release (RC channel, #62)"
        required: false
        type: boolean
        default: false
  # Allows retrying a failed release build from the corrected workflow without
  # changing or recreating its already-pushed version tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (e.g. v1.0.9)"
        required: true
        type: string
      prerelease:
        description: "Publish as a GitHub pre-release"
        required: false
        type: boolean
        default: false

jobs:
  build-tauri:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Self-hosted runners (#62 follow-up): "Linux" matches only the herp
        # runner, "windows-desktop" only the Windows runner (GitHub-hosted
        # runners never carry these labels). Release builds run on our own
        # pushes/tags only — fork PRs never reach this workflow.
        os: [Linux, windows-desktop]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Self-hosted runners may not have the GitHub CLI on PATH (the upload
      # step below needs it). Idempotent: skips if `gh` already resolves.
      - name: Ensure gh CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "installing gh CLI"
            type -p curl >/dev/null || sudo apt-get update
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          else
            echo "gh already present: $(gh --version | head -1)"
          fi

      # Tag/version drift guard (#14): the tag must match package.json
      # (the canonical version). Without this a stale or hand-made tag
      # ships installers that report a different version than they're
      # labeled with. package.json is read with Node (no jq on Windows
      # runners); a multi-line JSON strip means grep can't false-positive
      # on a substring of a longer version.
      - name: Guard — tag must match package.json version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          # Full-string compare: an -rc.N suffix (#62) must match too.
          if [ "$tag" != "v$pkg" ]; then
            echo "::error::tag/version drift: tag is '$tag' but package.json says '$pkg' (canonical). Bump package.json or fix the tag."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system deps
        if: matrix.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend deps
        # bash, not the Windows runner's default PowerShell (its execution
        # policy blocks script execution entirely).
        shell: bash
        run: npm ci

      # Standalone backend executable (PyInstaller) so the installer needs
      # no system Python. externalBin makes this file mandatory for the
      # Tauri CLI, so it must exist before `tauri build`.
      - name: Build backend sidecar
        shell: bash
        run: bash scripts/build_sidecar.sh

      # Headless server: the same backend app, lean build (no voice /
      # computer-use deps). Windows: single self-contained setup exe
      # (service host + wizard). Linux: binary packaged as the daemon
      # .deb (scripts/build_server.sh, build_server_deb.sh).
      - name: Build headless server
        shell: bash
        run: |
          bash scripts/build_server.sh
          if [ -f dist/yaah-server-setup.exe ]; then
            mv dist/yaah-server-setup.exe yaah-server-setup.exe
          else
            # The deb script still needs the binary in dist/ — build it
            # BEFORE renaming anything out of dist/.
            bash scripts/build_server_deb.sh
            mv dist/yaah-server_*_all.deb yaah-server-setup.deb
          fi

      - name: Build (verbose, logged)
        shell: bash
        run: npx tauri build --verbose 2>&1 | tee build.log

      - name: Report failure cause
        if: failure()
        shell: bash
        run: |
          grep -inE "error(\[E[0-9]+\])?:|error:|failed to|panicked" build.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "=== memory/disk ==="
          (free -h || true) 2>/dev/null
          (df -h . || true)
          npx tauri info 2>&1 | tail -40 || true

      - name: Attach full build log to release
        if: failure()
        shell: bash
        run: cp build.log "build-${RUNNER_OS,,}.log"
      - if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: build-*.log
          overwrite_files: true
          # #62: an RC build failure must not publish its log as a stable
          # release — mirror the channel of the tag being built. The tag-push
          # path has no input, so rc-ness falls back to the tag name.
          prerelease: ${{ inputs.prerelease == true || contains(inputs.tag || github.ref_name, '-rc') }}

      # Uploads via gh with per-file retries: softprops/action-gh-release has
      # none, and the 110–240MB assets have repeatedly died mid-upload on
      # GitHub's flaky release endpoint ("Error saving asset", "Headers
      # Timeout Error", HTML 502s). Per-file so one bad upload can't sink the
      # rest; --clobber so re-runs overwrite instead of name-conflicting.
      - name: Upload release assets
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          # Exactly four artifacts: one setup exe + one setup deb per OS.
          # Desktop NSIS/deb are renamed from tauri's versioned names.
          if [ "$RUNNER_OS" = Windows ]; then
            mv src-tauri/target/release/bundle/nsis/yaah_*_x64-setup.exe yaah-desktop-setup.exe
            files="yaah-desktop-setup.exe yaah-server-setup.exe"
          else
            mv src-tauri/target/release/bundle/deb/yaah_*_amd64.deb yaah-desktop-setup.deb
            files="yaah-desktop-setup.deb yaah-server-setup.deb"
          fi
          echo "assets:"; echo "$files"
          # #62: the RC channel is a property of the version, not of who
          # pushed the tag. workflow_call runs get it from the input; a
          # direct tag push must derive it from the tag name, or an -rc.N
          # release silently publishes to the stable channel.
          release_args=("$tag" --title "$tag" --generate-notes)
          if [ "${{ inputs.prerelease }}" = "true" ] || echo "$tag" | grep -Eq -- '-rc\.[0-9]+$'; then
            release_args+=(--prerelease)
          fi
          gh release view "$tag" >/dev/null 2>&1 || {
            # Both OS jobs can race to create the same release. Ignore a create
            # failure only if the other job successfully created it meanwhile.
            gh release create "${release_args[@]}" || gh release view "$tag" >/dev/null 2>&1 || exit 1
          }
          rc=0
          for f in $files; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if gh release upload "$tag" "$f" --clobber; then ok=1; break; fi
              echo "::warning::upload attempt $attempt failed for $f, retrying"
              sleep 20
            done
            [ "$ok" = 1 ] || { echo "::error::gave up uploading $f"; rc=1; }
          done
          for f in $files; do
            gh release view "$tag" --json assets -q '.assets[].name' | grep -Fx "$(basename "$f")" \
              || { echo "::error::asset missing from release: $f"; rc=1; }
          done
          exit $rc
