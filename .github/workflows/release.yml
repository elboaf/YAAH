name: Release

# Desktop installers (Q34 / plan Step 13): built with the Tauri CLI on tag push.
# Drafts a GitHub Release with the artifacts attached; publish the draft manually.
# Apps are unsigned — expect OS security warnings on first run.

on:
  push:
    tags: ["v*"]

jobs:
  build-tauri:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend deps
        run: npm ci

      # Standalone backend executable (PyInstaller) so the installer needs
      # no system Python. externalBin makes this file mandatory for the
      # Tauri CLI, so it must exist before `tauri build`.
      - name: Build backend sidecar
        shell: bash
        run: bash scripts/build_sidecar.sh

      - name: Build (verbose, logged)
        shell: bash
        run: npx tauri build --verbose 2>&1 | tee build.log

      - name: Report failure cause
        if: failure()
        shell: bash
        run: |
          grep -inE "error(\[E[0-9]+\])?:|error:|failed to|panicked" build.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "=== memory/disk ==="
          (free -h || true) 2>/dev/null
          (df -h . || true)
          npx tauri info 2>&1 | tail -40 || true

      - name: Attach full build log to release
        if: failure()
        shell: bash
        run: cp build.log "build-${RUNNER_OS,,}.log"
      - if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: build-*.log
          overwrite_files: true

      - name: Upload Windows artifacts
        if: success() && matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi

      - name: Upload macOS artifacts
        if: success() && matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz

      - name: Upload Linux artifacts
        if: success() && matrix.os == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
