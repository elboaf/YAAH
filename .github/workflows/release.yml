name: Release

# Desktop installers (Q34 / plan Step 13): built with the Tauri CLI on tag push.
# Publishes the GitHub Release automatically (no manual draft promotion).
# Apps are unsigned — expect OS security warnings on first run.
#
# Runner layout (#62 follow-up): the pool is TWO self-hosted Linux runners
# (herp, herp-2, bare "Linux" label) and TWO self-hosted Windows runners
# (bare "windows-desktop" label). The matrix below is the pool itself -
# one job per physical machine, four builds in parallel instead of two
# machines serially building two artifacts each.

env:
  # #778: the Linux sidecar MUST be frozen from a BASELINE (non-x86-64-v3)
  # CPython. The setup-python build on the self-hosted Ubuntu 26.04 pool is
  # x86-64-v3 (AVX2); frozen libpython then SIGILLs on pre-Haswell CPUs
  # (actions/setup-python#1390). The Linux build jobs download this pinned
  # python-build-standalone install instead and prepend its bin/ to PATH, so
  # `python`, `pip` and `python -m PyInstaller` all resolve to the baseline
  # interpreter. Plain "x86_64-unknown-linux-gnu" is the baseline flavor —
  # the _v2/_v3/_v4 flavors are the microarchitecture tiers. SHA-256 pins
  # the artifact itself (same pattern as scripts/bundle_gh.sh).
  PBS_RELEASE_TAG: "20261110"
  PBS_VERSION: "3.12.16"
  PBS_ASSET: "cpython-3.12.16+20261110-x86_64-unknown-linux-gnu-install_only.tar.gz"
  PBS_SHA256: "c2f87d4b4e8db3abddb0f116c6ccfc503d0cbdbb9ee8faacddad1b679ec12e99"

on:
  push:
    tags: ["v*"]
  # Invoked by tag-on-bump.yml after it validates + pushes the version tag.
  # GITHUB_TOKEN-created tags don't trigger other workflows (GitHub's
  # recursion guard), so the release build is called directly instead of
  # relying on the tag-push event.
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish (e.g. v0.19.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a GitHub pre-release (RC channel, #62)"
        required: false
        type: boolean
        default: false
  # Allows retrying a failed release build from the corrected workflow without
  # changing or recreating its already-pushed version tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (e.g. v1.0.9)"
        required: true
        type: string
      prerelease:
        description: "Publish as a GitHub pre-release"
        required: false
        type: boolean
        default: false

jobs:
  tests:
    name: Backend tests (gate)
    # Edge gate (docs/agents/testing.md): the release/RC tag gets the full
    # backend suite before any installer is built — tags are permanent and
    # shipped, so this is the last cheap place to catch what the PR edge's
    # targeted local runs missed. Frontend needs no job here: `tauri build`
    # below compiles the frontend (typecheck lives at the PR edge).
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Same warm-cache note as ci.yml: explicit install until the
          # requirements cache carries these.
          python -c "import pytest_shard" 2>/dev/null || pip install "pytest-shard>=0.1.2"
          python -c "import xdist" 2>/dev/null || pip install "pytest-xdist>=3.5"

      - name: Run tests
        run: |
          # Whole suite on one runner, xdist-2 for wall time. No sharding:
          # sharding needs the two-runner pairing CI has.
          pytest backend/tests -v -n 2 2>&1 | tee test-output.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Report failures
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" test-output.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          tail -50 test-output.log | while IFS= read -r line; do echo "::error::$line"; done

  build:
    name: Build (${{ matrix.artifact }} / ${{ matrix.os }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        # The runner pool, spelled out: 2x Linux (herp pool) x {desktop,
        # server} + 2x Windows x {desktop, server}. Each cell lands on its
        # own physical machine; desktop and server no longer queue behind
        # each other on the same box.
        os: [Linux, windows-desktop]
        artifact: [desktop, server]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        if: matrix.artifact == 'desktop'
        with:
          node-version: 20
          cache: npm

      # Both Linux cells upload via gh below. Idempotent: skips if `gh`
      # already resolves (the herp runners have it preinstalled; this is
      # the fallback for a fresh/replaced runner).
      - name: Ensure gh CLI
        if: matrix.os == 'Linux'
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "installing gh CLI"
            type -p curl >/dev/null || sudo apt-get update
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          else
            echo "gh already present: $(gh --version | head -1)"
          fi

      # Tag/version drift guard (#14): the tag must match package.json
      # (the canonical version). Without this a stale or hand-made tag
      # ships installers that report a different version than they're
      # labeled with. package.json is read with Node; exactly ONE cell
      # runs this - four copies would be four chances to race a bad tag.
      - name: Guard — tag must match package.json version
        if: matrix.os == 'Linux' && matrix.artifact == 'desktop'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          # Full-string compare: an -rc.N suffix (#62) must match too.
          if [ "$tag" != "v$pkg" ]; then
            echo "::error::tag/version drift: tag is '$tag' but package.json says '$pkg' (canonical). Bump package.json or fix the tag."
            exit 1
          fi

      # rc.16 release fix: dtolnay/rust-toolchain only appends CARGO_HOME\bin
      # to the job PATH when it takes its install-rustup branch. On the
      # persistent Windows runners rustup outlives the job (rc.16's first
      # attempt installed it), so later runs skip that branch and even the
      # action's own internal `rustc` call dies with exit 127 (command not
      # found) — the toolchain is installed and default, just uncallable.
      # Put the cargo bin dir on PATH BEFORE the action runs. CARGO_HOME is
      # machine-set on the release runners; the USERPROFILE fallback covers
      # a fresh box where the action would install rustup anyway.
      - name: Put cargo bin on PATH
        if: matrix.artifact == 'desktop'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "${CARGO_HOME:-$USERPROFILE\.cargo}\bin" >> "$GITHUB_PATH"
          else
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.artifact == 'desktop'

      - uses: swatinem/rust-cache@v2
        if: matrix.artifact == 'desktop'
        with:
          workspaces: src-tauri

      # #778: on Linux the FREEZE interpreter must be the baseline (non-v3)
      # build pinned in the workflow-level env above — setup-python hands
      # out an x86-64-v3 (AVX2) CPython on the Ubuntu 26.04 self-hosted
      # pool (actions/setup-python#1390), whose libpython SIGILLs on
      # pre-Haswell CPUs. The baseline tarball goes to $RUNNER_TEMP (wiped
      # per job) and its bin/ is PREPENDED so `python`/`pip`/
      # `python -m PyInstaller` all resolve to it. Windows cells keep
      # setup-python untouched.
      - name: Provision baseline CPython (Linux sidecar freeze)
        if: matrix.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE_TAG}/${PBS_ASSET}"
          echo "downloading $url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pbs.tar.gz" "$url"
          echo "${PBS_SHA256}  ${RUNNER_TEMP}/pbs.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/baseline-python"
          tar -xzf "$RUNNER_TEMP/pbs.tar.gz" -C "$RUNNER_TEMP/baseline-python"
          PYBIN="$RUNNER_TEMP/baseline-python/python/bin"
          "$PYBIN/python" -VV
          "$PYBIN/python" scripts/check_baseline_libpython.py
          echo "$PYBIN" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        if: matrix.os != 'Linux'
        with:
          python-version: "3.12"

      # Server builds skip the desktop Rust toolchain and system GUI deps
      # entirely: PyInstaller + Python is their whole toolchain.
      - name: Install Linux system deps
        if: matrix.os == 'Linux' && matrix.artifact == 'desktop'
        shell: bash
        run: |
          # Idempotent: the herp runners are persistent, so re-running
          # apt-get update + install on every release just burns minutes.
          if pkg-config --exists webkit2gtk-4.1 2>/dev/null && command -v patchelf >/dev/null 2>&1; then
            echo "Linux system deps already present"
          else
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
          fi

      - name: Install frontend deps
        if: matrix.artifact == 'desktop'
        # bash, not the Windows runner's default PowerShell (its execution
        # policy blocks script execution entirely).
        shell: bash
        run: npm ci

      # Standalone backend executable (PyInstaller) so the installer needs
      # no system Python. externalBin makes this file mandatory for the
      # Tauri CLI, so it must exist before `tauri build`.
      - name: Build backend sidecar
        if: matrix.artifact == 'desktop'
        shell: bash
        run: bash scripts/build_sidecar.sh

      # Headless server: the same backend app, lean build (no voice /
      # computer-use deps). Windows: single self-contained setup exe
      # (service host + wizard). Linux: binary packaged as the daemon
      # .deb (scripts/build_server.sh, build_server_deb.sh).
      - name: Build headless server
        if: matrix.artifact == 'server'
        shell: bash
        run: |
          bash scripts/build_server.sh
          if [ -f dist/yaah-server-setup.exe ]; then
            mv dist/yaah-server-setup.exe yaah-server-setup.exe
          else
            # The deb script still needs the binary in dist/ — build it
            # BEFORE renaming anything out of dist/.
            bash scripts/build_server_deb.sh
            mv dist/yaah-server_*_all.deb yaah-server-setup.deb
          fi

      # Regression gate (#778): the libpython bundled INSIDE the frozen
      # executables must be the baseline one. Presence of AVX2-only
      # mnemonics proves nothing - the baseline libpython legitimately
      # carries 76 of them in dispatch-gated crypto clusters - so the
      # verdict is (1) sha256 chain of custody against the pinned
      # artifact's measured libpython hash, then (2) a calibrated spread
      # scan (3x measured baseline, min 25) that catches a v3-shaped
      # body (488 hits) without rejecting baseline-shaped ones. The
      # Linux onefile executables are PyInstaller CArchives - libpython
      # is compressed inside, so the raw bytes are read via the CArchive
      # cookie + TOC and zlib first. `python` here is the baseline
      # interpreter provisioned above. Windows has no gate -
      # setup-python's local build matches the Windows target CPUs.
      - name: AVX2 gate (bundled libpython is the pinned baseline)
        if: matrix.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_avx2_gate.py dist/backend dist/yaah-server
          echo "AVX2 gate passed: libpython custody + spread envelope verified"

      - name: Build (verbose, logged)
        if: matrix.artifact == 'desktop'
        shell: bash
        run: npx tauri build --verbose 2>&1 | tee build.log

      - name: Report failure cause
        if: failure() && matrix.artifact == 'desktop'
        shell: bash
        run: |
          grep -inE "error(\[E[0-9]+\])?:|error:|failed to|panicked" build.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "=== memory/disk ==="
          (free -h || true) 2>/dev/null
          (df -h . || true)
          npx tauri info 2>&1 | tail -40 || true

      - name: Attach full build log to release
        if: failure() && matrix.artifact == 'desktop'
        shell: bash
        run: cp build.log "build-${RUNNER_OS,,}.log"
      - if: failure() && matrix.artifact == 'desktop'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: build-*.log
          overwrite_files: true
          # #62: an RC build failure must not publish its log as a stable
          # release — mirror the channel of the tag being built. The tag-push
          # path has no input, so rc-ness falls back to the tag name.
          prerelease: ${{ inputs.prerelease == true || contains(inputs.tag || github.ref_name, '-rc') }}

      # Uploads via gh with per-file retries: softprops/action-gh-release has
      # none, and the 110–240MB assets have repeatedly died mid-upload on
      # GitHub's flaky release endpoint ("Error saving asset", "Headers
      # Timeout Error", HTML 502s). --clobber so re-runs overwrite instead of
      # name-conflicting. Each cell uploads ONLY the artifact it built.
      - name: Upload release asset
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          if [ "$RUNNER_OS" = Windows ]; then
            if [ "${{ matrix.artifact }}" = desktop ]; then
              mv src-tauri/target/release/bundle/nsis/yaah_*_x64-setup.exe yaah-desktop-setup.exe
              files="yaah-desktop-setup.exe"
            else
              files="yaah-server-setup.exe"
            fi
          else
            if [ "${{ matrix.artifact }}" = desktop ]; then
              mv src-tauri/target/release/bundle/deb/yaah_*_amd64.deb yaah-desktop-setup.deb
              files="yaah-desktop-setup.deb"
            else
              files="yaah-server-setup.deb"
            fi
          fi
          echo "assets:"; echo "$files"
          # #62: the RC channel is a property of the version, not of who
          # pushed the tag. workflow_call runs get it from the input; a
          # direct tag push must derive it from the tag name, or an -rc.N
          # release silently publishes to the stable channel.
          release_args=("$tag" --title "$tag" --generate-notes)
          if [ "${{ inputs.prerelease }}" = "true" ] || echo "$tag" | grep -Eq -- '-rc\.[0-9]+$'; then
            release_args+=(--prerelease)
          fi
          gh release view "$tag" >/dev/null 2>&1 || {
            # All four cells race to create the same release. Ignore a create
            # failure only if someone successfully created it meanwhile.
            gh release create "${release_args[@]}" || gh release view "$tag" >/dev/null 2>&1 || exit 1
          }
          rc=0
          for f in $files; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if gh release upload "$tag" "$f" --clobber; then ok=1; break; fi
              echo "::warning::upload attempt $attempt failed for $f, retrying"
              sleep 20
            done
            [ "$ok" = 1 ] || { echo "::error::gave up uploading $f"; rc=1; }
          done
          for f in $files; do
            gh release view "$tag" --json assets -q '.assets[].name' | grep -Fx "$(basename "$f")" \
              || { echo "::error::asset missing from release: $f"; rc=1; }
          done
          exit $rc

  apk:
    name: Build Android thin-client APK (Linux)
    # Android thin client, built on the Linux runner alongside the desktop /
    # server installers and uploaded to the same release. Debug build
    # (auto-signed by Gradle) - the app has no release signing config, and a
    # debug APK is the installable artifact used for RC device verification.
    needs: tests
    runs-on: Linux
    permissions:
      contents: write
    env:
      # Pinned for a reproducible artifact. compileSdk/targetSdk is 34 and the
      # project pins AGP 8.1.2, which needs Gradle 8.0+; the thin client builds
      # on Gradle 8.5 (the 9.7.1 wrapper is incompatible). No wrapper exists in
      # android/, so Gradle is provisioned here explicitly.
      ANDROID_TOOLS_VERSION: "11076708"
      ANDROID_SDK_ROOT: "$RUNNER_TEMP/android-sdk"
      GRADLE_VERSION: "8.5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - name: Provision Gradle 8.5
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_HOME="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          fi
          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle --version | sed -n '1,4p'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL --retry 3 -o tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_TOOLS_VERSION}_latest.zip"
          unzip -q tools.zip
          mv cmdline-tools latest
          # platform-34 for compileSdk/targetSdk 34, build-tools 34.0.0 for AGP 8.1,
          # platform-tools for adb. --console accepts licenses non-interactively
          # (this sdkmanager build rejects --accept-licenses). Feed yes via process
          # substitution so its SIGPIPE (when sdkmanager closes its input) cannot
          # fail the pipeline under pipefail; only sdkmanager's real exit status
          # fails the job.
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --console \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" < <(yes)

      - name: Point local.properties at the Linux SDK
        # The repo ships android/local.properties with a Windows sdk.dir; overwrite
        # it on the runner (ephemeral, never committed) so Gradle finds the SDK.
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cat android/local.properties

      - name: Build debug APK
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-apk.log
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::APK not produced"
            tail -40 build-apk.log
            exit 1
          fi

      - name: Rename APK for the release asset
        shell: bash
        working-directory: android
        run: mv app/build/outputs/apk/debug/app-debug.apk yaah-android.apk

      - name: Report failure cause
        if: failure()
        shell: bash
        run: |
          grep -inE "error(\[E[0-9]+\])?:|error:|FAILED|what went wrong" android/build-apk.log \
            | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          (free -h || true) 2>/dev/null
          (df -h android || true) 2>/dev/null

      - name: Upload APK to release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          files="android/yaah-android.apk"
          release_args=("$tag" --title "$tag" --generate-notes)
          if [ "${{ inputs.prerelease }}" = "true" ] || echo "$tag" | grep -Eq -- '-rc\.[0-9]+$'; then
            release_args+=(--prerelease)
          fi
          gh release view "$tag" >/dev/null 2>&1 || {
            gh release create "${release_args[@]}" || gh release view "$tag" >/dev/null 2>&1 || exit 1
          }
          rc=0
          for f in $files; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if gh release upload "$tag" "$f" --clobber; then ok=1; break; fi
              echo "::warning::upload attempt $attempt failed for $f, retrying"
              sleep 20
            done
            [ "$ok" = 1 ] || { echo "::error::gave up uploading $f"; rc=1; }
          done
          for f in $files; do
            gh release view "$tag" --json assets -q '.assets[].name' | grep -Fx "$(basename "$f")" \
              || { echo "::error::asset missing from release: $f"; rc=1; }
          done
          exit $rc
