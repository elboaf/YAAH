name: Release

# Desktop installers (Q34 / plan Step 13): built with the Tauri CLI on tag push.
# Publishes the GitHub Release automatically (no manual draft promotion).
# Apps are unsigned — expect OS security warnings on first run.

on:
  push:
    tags: ["v*"]

jobs:
  build-tauri:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend deps
        run: npm ci

      # Standalone backend executable (PyInstaller) so the installer needs
      # no system Python. externalBin makes this file mandatory for the
      # Tauri CLI, so it must exist before `tauri build`.
      - name: Build backend sidecar
        shell: bash
        run: bash scripts/build_sidecar.sh

      # Headless server (yaah-server): the same backend app, lean build
      # (no voice / computer-use deps), console entry point. Attached to
      # the release so a target device can host for desktop clients
      # without running the GUI (scripts/build_server.sh).
      - name: Build headless server
        shell: bash
        run: |
          bash scripts/build_server.sh
          if [ -f dist/yaah-server.exe ]; then
            mv dist/yaah-server.exe "yaah-server-${RUNNER_OS,,}.exe"
            mv dist/yaah-server-setup.exe "yaah-server-setup-${RUNNER_OS,,}.exe"
          else
            # Daemon packaging (scripts/build_server_deb.sh) still needs the
            # binary in dist/ — build the deb BEFORE renaming the exe.
            bash scripts/build_server_deb.sh
            mv dist/yaah-server "yaah-server-${RUNNER_OS,,}"
            mv dist/yaah-server_*_all.deb "yaah-server-${RUNNER_OS,,}.deb"
          fi

      - name: Build (verbose, logged)
        shell: bash
        run: npx tauri build --verbose 2>&1 | tee build.log

      - name: Report failure cause
        if: failure()
        shell: bash
        run: |
          grep -inE "error(\[E[0-9]+\])?:|error:|failed to|panicked" build.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "=== memory/disk ==="
          (free -h || true) 2>/dev/null
          (df -h . || true)
          npx tauri info 2>&1 | tail -40 || true

      - name: Attach full build log to release
        if: failure()
        shell: bash
        run: cp build.log "build-${RUNNER_OS,,}.log"
      - if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build-*.log
          overwrite_files: true

      # Uploads via gh with per-file retries: softprops/action-gh-release has
      # none, and the 110–240MB assets have repeatedly died mid-upload on
      # GitHub's flaky release endpoint ("Error saving asset", "Headers
      # Timeout Error", HTML 502s). Per-file so one bad upload can't sink the
      # rest; --clobber so re-runs overwrite instead of name-conflicting.
      - name: Upload release assets
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Array + quoted globs: unquoted, *.exe would expand against the
          # repo root (which holds yaah-server-windows*.exe by this point)
          # and find would die on "paths must precede expression".
          case "$RUNNER_OS" in
            Windows) pats=(-name '*.exe' -o -name '*.msi') ;;
            Linux)   pats=(-name '*.AppImage' -o -name '*.deb' -o -name '*.rpm') ;;
          esac
          files=$(find src-tauri/target/release/bundle -type f \( "${pats[@]}" \))
          # The headless server exe (renamed per-OS by the build step:
          # yaah-server-windows.exe / -linux) + its README.
          files="$files yaah-server-${RUNNER_OS,,}* README-server.txt"
          echo "assets:"; echo "$files"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes || true
          rc=0
          for f in $files; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if gh release upload "$tag" "$f" --clobber; then ok=1; break; fi
              echo "::warning::upload attempt $attempt failed for $f, retrying"
              sleep 20
            done
            [ "$ok" = 1 ] || { echo "::error::gave up uploading $f"; rc=1; }
          done
          for f in $files; do
            gh release view "$tag" --json assets -q '.assets[].name' | grep -Fx "$(basename "$f")" \
              || { echo "::error::asset missing from release: $f"; rc=1; }
          done
          exit $rc
