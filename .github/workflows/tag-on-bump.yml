name: Tag on bump

# Auto-release pipeline (#14): bump package.json (the canonical version) on
# master and this pushes tag v<version>, then calls release.yml directly to
# build + publish the installers.
#
# Why the direct call: a tag created with GITHUB_TOKEN does NOT trigger
# other workflows (GitHub's recursion guard), so relying on release.yml's
# `push: tags:` trigger would silently produce a tag with no release.
#
# Version flow: package.json is the ONE file a release bumps. The Tauri app
# reads its version from it (tauri.conf.json: "version": "../package.json")
# and the PyInstaller builds regenerate backend/_version.py from it
# (scripts/sync_version.py), so there is nothing else to keep in sync.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-on-bump
  cancel-in-progress: false

jobs:
  tag:
    name: Validate + push version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      pushed: ${{ steps.push.outputs.pushed }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Read canonical version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "package.json=$version"
          if [ -z "$version" ]; then
            echo "::error::could not parse a version from package.json"
            exit 1
          fi
          # #62: plain stable (X.Y.Z) or release candidate (X.Y.Z-rc.N).
          # Anything else must not become a tag.
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::version '$version' is not X.Y.Z or X.Y.Z-rc.N"
            exit 1
          fi
          if echo "$version" | grep -Eq -- '-rc\.[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists - nothing to do (already released?)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        id: push
        if: steps.exists.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          if git push origin "$TAG"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            # Lost a race with a concurrent run: tag exists now, treat as done.
            echo "$TAG was pushed by a concurrent run"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::failed to push $TAG and it does not exist on origin"
            exit 1
          fi

  release:
    name: Build + publish release
    needs: tag
    if: needs.tag.outputs.pushed == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
    permissions:
      contents: write
