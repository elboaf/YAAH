name: Tag on bump

# Auto-release pipeline (#14): bump package.json (the canonical version) on
# master and this pushes tag v<version>, then calls release.yml directly to
# build + publish the installers.
#
# Why the direct call: a tag created with GITHUB_TOKEN does NOT trigger
# other workflows (GitHub's recursion guard), so relying on release.yml's
# `push: tags:` trigger would silently produce a tag with no release.
#
# Version flow: package.json is the ONE file a release bumps. The Tauri app
# reads its version from it (tauri.conf.json: "version": "../package.json")
# and the PyInstaller builds regenerate backend/_version.py from it
# (scripts/sync_version.py), so there is nothing else to keep in sync.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Serial by design: two pushes racing to tag different versions must not
# interleave (a lost race silently skips a release). Not cancel-in-progress:
# a superseded run's tag push would be dropped, not restarted.
concurrency:
  group: tag-on-bump
  cancel-in-progress: false

jobs:
  tag:
    name: Validate + push version tag
    # Self-hosted herp pool (bare "Linux" label): the repo has no
    # GitHub-hosted capacity; ubuntu-latest queues forever.
    runs-on: Linux
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      pushed: ${{ steps.push.outputs.pushed }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # The version step shells out to bare `node`; GitHub-hosted runners
      # have it preinstalled, the self-hosted herp pool gets it here (same
      # precedent as ci.yml / release.yml on this runner).
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read canonical version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "package.json=$version"
          if [ -z "$version" ]; then
            echo "::error::could not parse a version from package.json"
            exit 1
          fi
          # #62: plain stable (X.Y.Z) or release candidate (X.Y.Z-rc.N).
          # Anything else must not become a tag.
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::version '$version' is not X.Y.Z or X.Y.Z-rc.N"
            exit 1
          fi
          if echo "$version" | grep -Eq -- '-rc\.[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists - nothing to do (already released?)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Release gate: the tag is only pushed once CI is green on THIS
      # commit. A red master never ships installers - the tag (and with it
      # the release build) simply waits or fails loudly. The bump commit
      # itself triggers that CI run, so the common path is: bump pushed ->
      # CI runs here and on the Linux pool -> tag pushed -> release built.
      - name: Wait for CI on this commit
        if: steps.exists.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const deadline = Date.now() + 30 * 60 * 1000;
            while (Date.now() < deadline) {
              const res = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              });
              const ciRuns = res.data.workflow_runs.filter(
                (r) => r.name === 'CI' && r.event === 'push' && r.status === 'completed'
              );
              if (ciRuns.length > 0) {
                const failed = ciRuns.filter((r) => r.conclusion !== 'success');
                if (failed.length > 0) {
                  core.setFailed(
                    'CI is not green on ' + sha + ': ' +
                    failed.map((r) => r.name + '=' + r.conclusion).join(', ')
                  );
                  return;
                }
                core.info('CI green on ' + sha + ' - releasing');
                return;
              }
              core.info('CI still running on ' + sha + '; waiting 30s');
              await new Promise((r) => setTimeout(r, 30000));
            }
            core.setFailed('CI did not complete within 30 minutes on ' + sha);

      - name: Push tag
        id: push
        if: steps.exists.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          if git push origin "$TAG"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            # Lost a race with a concurrent run: tag exists now, treat as done.
            echo "$TAG was pushed by a concurrent run"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::failed to push $TAG and it does not exist on origin"
            exit 1
          fi

  release:
    name: Build + publish release
    needs: tag
    if: needs.tag.outputs.pushed == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
    permissions:
      contents: write
