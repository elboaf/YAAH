name: Test Build

# Builds the Tauri desktop app without creating a release. Manual only
# ("Run workflow" in the Actions tab, pick the platform: windows, linux,
# or all) — PRs no longer auto-trigger it: a full Tauri build per push
# chewed the self-hosted runners with no payoff. CI (ci.yml) already
# covers typecheck/tests on every push. Installers are attached as
# workflow artifacts.

env:
  # #778: must stay IDENTICAL to the block in release.yml — the Linux
  # sidecar test build freezes from the same pinned BASELINE (non-x86-64-v3)
  # CPython as the release build. See release.yml for the full rationale.
  PBS_RELEASE_TAG: "20261110"
  PBS_VERSION: "3.12.16"
  PBS_ASSET: "cpython-3.12.16+20261110-x86_64-unknown-linux-gnu-install_only.tar.gz"
  PBS_SHA256: "c2f87d4b4e8db3abddb0f116c6ccfc503d0cbdbb9ee8faacddad1b679ec12e99"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        default: windows
        options:
          - windows
          - linux
          - all
      ref:
        description: "Optional branch/SHA to build (default: the pushed branch/commit)"
        type: string
        required: false
        default: ""

jobs:
  test-build:
    name: Test build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Self-hosted runners (#62 follow-up): "Linux" matches only the herp
        # runner (GitHub-hosted runners never carry a bare "Linux" label),
        # "windows-desktop" only the Windows runner. Fork PRs can't reach
        # these without a write-access approval (repo setting), so untrusted
        # code never executes here.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["Linux"]' || (inputs.platform == 'all' && '["windows-desktop", "Linux"]' || (inputs.platform == 'windows' && '["windows-desktop"]' || '["Linux"]'))) }}
    runs-on: ${{ matrix.os }}
    steps:
      # Optional dispatch input to validate a specific branch/SHA without
      # cutting a release tag (e.g. a fix branch for a release-pipeline
      # failure). Empty = checkout's default (the event commit the run was
      # dispatched for - NOT github.ref, which would track the branch tip).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # #778: Linux must freeze from the pinned BASELINE (non-x86-64-v3)
      # CPython — setup-python's Ubuntu 26.04 build is AVX2 (see release.yml).
      # Same download/PATH-prepend as the release build; Windows keeps
      # setup-python.
      - name: Provision baseline CPython (Linux sidecar freeze)
        if: matrix.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE_TAG}/${PBS_ASSET}"
          echo "downloading $url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pbs.tar.gz" "$url"
          echo "${PBS_SHA256}  ${RUNNER_TEMP}/pbs.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/baseline-python"
          tar -xzf "$RUNNER_TEMP/pbs.tar.gz" -C "$RUNNER_TEMP/baseline-python"
          PYBIN="$RUNNER_TEMP/baseline-python/python/bin"
          "$PYBIN/python" -VV
          "$PYBIN/python" scripts/check_baseline_libpython.py
          echo "$PYBIN" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        if: matrix.os != 'Linux'
        with:
          python-version: "3.12"

      - name: Install Linux system deps
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend deps
        # bash, not the Windows runner's default PowerShell (its execution
        # policy blocks script execution entirely).
        shell: bash
        run: npm ci

      # Standalone backend executable (PyInstaller); externalBin makes this
      # file mandatory for the Tauri CLI.
      - name: Build backend sidecar
        shell: bash
        run: bash scripts/build_sidecar.sh

      - name: Build (verbose, logged)
        shell: bash
        run: npx tauri build --verbose 2>&1 | tee build.log

      - name: Upload installers as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          if-no-files-found: ignore
          path: build.log
