name: Test Build

# Builds the Tauri desktop app without creating a release. Run it manually
# from the Actions tab ("Run workflow") and pick the platform: windows,
# macos, linux, or all. Pull requests touching the app get a cheap
# Linux-only smoke build. Installers are attached as workflow artifacts.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        default: windows
        options:
          - windows
          - macos
          - linux
          - all
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "backend/**"
      - ".github/workflows/test-build.yml"

jobs:
  test-build:
    name: Test build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # PRs smoke-build Linux only; dispatch builds the chosen platform.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-22.04"]' || (inputs.platform == 'all' && '["windows-latest", "macos-latest", "ubuntu-22.04"]' || (inputs.platform == 'windows' && '["windows-latest"]' || (inputs.platform == 'macos' && '["macos-latest"]' || '["ubuntu-22.04"]')))) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend deps
        run: npm ci

      # Standalone backend executable (PyInstaller); externalBin makes this
      # file mandatory for the Tauri CLI.
      - name: Build backend sidecar
        shell: bash
        run: bash scripts/build_sidecar.sh

      - name: Build (verbose, logged)
        shell: bash
        run: npx tauri build --verbose 2>&1 | tee build.log

      - name: Upload installers as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          if-no-files-found: ignore
          path: build.log
